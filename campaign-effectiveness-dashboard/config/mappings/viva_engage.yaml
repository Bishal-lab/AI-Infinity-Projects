# Viva Engage (formerly Yammer) community post analytics.
#
# This is the one AGGREGATE-ONLY source: Viva reports per post, not per person,
# so it can never contribute to person-level coverage or cross-channel
# deduplication. Its ENGAGED figure is counted in EVENTS (one person can react
# and comment on the same post) and is therefore excluded from person-based
# funnel arithmetic. Both facts are surfaced in the UI wherever Viva appears.

source: viva_engage
mapping_version: "1.0"
display_name: Viva Engage community analytics
grain: aggregate

detect:
  priority: 10
  filename_glob: ["*viva*", "*engage*", "*yammer*"]
  header_fingerprint:
    strong: ["Post Title", "Community", "Unique Viewers"]
    weak: ["Reactions", "Comments", "Shares", "Impressions", "Audience Size", "Post ID"]
    exclude: ["Recipient Email", "Attendance Duration", "Course Name"]
  min_score: 4

read:
  sheet: 0
  header_row: 1
  encoding: auto
  delimiter: auto
  na_values: ["", "-", "N/A", "NULL", "#N/A"]

keys:
  campaign:
    aliases: ["Campaign ID", "Campaign", "Community"]
    fallback_from_filename: 'viva_engage_(?P<campaign>[A-Za-z0-9._-]+?)_\d{4}-\d{2}'
    required: true
  post:
    aliases: ["Post ID", "Post Title", "Message ID"]
    required: false

fields:
  period_start:
    aliases: ["Published On", "Post Date", "Date"]
    type: date
    required: true
  audience_size:
    aliases: ["Audience Size", "Community Members", "Members"]
    type: number
    required: true
  impressions:
    aliases: ["Impressions", "Views"]
    type: number
    required: false
  unique_viewers:
    aliases: ["Unique Viewers", "Unique Views", "Reach"]
    type: number
    required: false
  reactions:
    aliases: ["Reactions", "Likes"]
    type: number
    required: false
  comments:
    aliases: ["Comments", "Replies"]
    type: number
    required: false
  shares:
    aliases: ["Shares", "Reshares"]
    type: number
    required: false

# Stage aggregation, done in comms_dashboard/ingest/adapters/viva_engage.py:
#   TARGETED = audience_size            (persons)
#   OPENED   = unique_viewers           (persons)
#   ENGAGED  = reactions + comments + shares  (EVENTS)

on_unknown_columns: warn
on_missing_optional: warn
on_missing_required: reject_file
