# Learning Management System enrolment / completion export
# (SuccessFactors, Cornerstone, Docebo, Moodle and Workday Learning all export
# a per-learner row with a status and a progress percentage).

source: lms
mapping_version: "1.0"
display_name: Learning Management export
grain: recipient

detect:
  priority: 10
  filename_glob: ["*lms*", "*learning*", "*course*", "*training*"]
  header_fingerprint:
    strong: ["Course Name", "Completion Status", "Learner ID"]
    weak: ["Progress %", "Score", "Enrolled On", "Completed On", "Assessment Passed", "Due Date"]
    exclude: ["Recipient Email", "Attendance Duration", "Post Title"]
  min_score: 4

read:
  sheet: 0
  header_row: 1
  encoding: auto
  delimiter: auto
  na_values: ["", "-", "N/A", "NULL", "#N/A", "Not started"]

keys:
  campaign:
    aliases: ["Campaign ID", "Course Code", "Course Name", "Curriculum"]
    fallback_from_filename: 'lms_(?P<campaign>[A-Za-z0-9._-]+?)_\d{4}-\d{2}'
    required: true
  recipient:
    aliases: ["Learner ID", "Learner Email", "User ID", "Employee ID"]
    id_type: lms_user_id
    canonicalise: [strip, lower]
    required: true

fields:
  targeted:
    const: true
    type: bool
  opened:
    aliases: ["Started", "Launched", "First Access"]
    type: bool
    required: false
  completed:
    aliases: ["Completion Status", "Completed", "Status"]
    type: bool
    required: true
    true_values: ["completed", "complete", "passed", "yes", "true", "1"]
    false_values: ["in progress", "not started", "incomplete", "failed", "no", "false", "0", "registered"]
  progress_pct:
    aliases: ["Progress %", "Progress", "Percent Complete"]
    type: percent
    required: false
  score:
    aliases: ["Score", "Assessment Score", "Final Score"]
    type: number
    required: false
  assessment_passed:
    aliases: ["Assessment Passed", "Passed", "Pass/Fail"]
    type: bool
    required: false
  targeted_at:
    aliases: ["Assigned On", "Enrolled On", "Enrolment Date", "Assigned Date"]
    type: datetime
    required: false
  completed_at:
    aliases: ["Completed On", "Completion Date"]
    type: datetime
    required: false
  due_date:
    aliases: ["Due Date", "Deadline"]
    type: date
    required: false
  department:
    aliases: ["Department", "Dept", "Org Unit"]
    type: string
    required: false

# ENGAGED is derived in the adapter as progress > 0 OR an assessment attempt —
# see comms_dashboard/ingest/adapters/lms.py.

on_unknown_columns: warn
on_missing_optional: warn
on_missing_required: reject_file
