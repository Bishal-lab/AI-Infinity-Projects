# WhatsApp Business API broadcast export (Meta / Twilio / Gupshup / Infobip
# all produce a per-message row with a status column; the alias lists below
# cover the common spellings).
#
# Note: consumer WhatsApp has no export at all. This adapter assumes your
# organisation broadcasts through a Business Solution Provider.

source: whatsapp
mapping_version: "1.0"
display_name: WhatsApp broadcast export
grain: recipient

detect:
  priority: 10
  filename_glob: ["*whatsapp*", "*wa_broadcast*", "*wab*"]
  header_fingerprint:
    strong: ["Message Template", "Phone Number", "Read At"]
    weak: ["Campaign", "Delivered At", "Replied", "Button Clicked", "Opted Out", "MSISDN"]
    exclude: ["Course Name", "Attendance Duration", "Recipient Email"]
  min_score: 4

read:
  sheet: 0
  header_row: 1
  encoding: auto
  delimiter: auto
  na_values: ["", "-", "N/A", "NULL", "#N/A"]

keys:
  campaign:
    aliases: ["Campaign ID", "Campaign", "Broadcast Name"]
    fallback_from_filename: 'whatsapp_(?P<campaign>[A-Za-z0-9._-]+?)_\d{4}-\d{2}'
    required: true
  recipient:
    aliases: ["Phone Number", "MSISDN", "Recipient", "To Number"]
    id_type: msisdn
    canonicalise: [strip, e164]
    required: true

fields:
  targeted:
    const: true
    type: bool
  delivered:
    aliases: ["Delivered", "Delivered At", "Delivery Status"]
    type: bool
    required: true
    true_values: ["delivered", "read", "yes", "true", "1", "sent"]
    false_values: ["failed", "undelivered", "no", "false", "0", "expired"]
  # Two shapes exist in the wild. Some BSPs give a Read flag; most give a
  # read_at timestamp and nothing else. Map both — the adapter derives the flag
  # from the timestamp when only the timestamp is present.
  opened:
    aliases: ["Read", "Seen", "Read Status"]
    type: bool
    required: false
  opened_at:
    aliases: ["Read At", "Read Time", "Read At Timestamp"]
    type: datetime
    required: false
  replied:
    aliases: ["Replied", "Reply Received", "Has Reply"]
    type: bool
    required: false
  button_clicked:
    aliases: ["Button Clicked", "CTA Clicked", "Quick Reply"]
    type: bool
    required: false
  opted_out:
    aliases: ["Opted Out", "Opt Out", "Blocked", "Stop"]
    type: bool
    required: false
  targeted_at:
    aliases: ["Sent At", "Send Time", "Submitted At"]
    type: datetime
    required: false

# ENGAGED is derived in the adapter as replied OR button_clicked — see
# comms_dashboard/ingest/adapters/whatsapp.py.

on_unknown_columns: warn
on_missing_optional: warn
on_missing_required: reject_file
