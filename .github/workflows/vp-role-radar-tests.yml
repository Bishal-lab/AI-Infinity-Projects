# The radar runs unattended, so its tests run on every change to it.
# Everything here is offline: no test touches a live board or a real inbox.

name: VP role radar tests

on:
  push:
    paths:
      - "vp-role-radar/**"
      - ".github/workflows/vp-role-radar-tests.yml"
  pull_request:
    paths:
      - "vp-role-radar/**"
      - ".github/workflows/vp-role-radar-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: vp-role-radar

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: vp-role-radar/requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
