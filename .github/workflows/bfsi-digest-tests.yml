# The digest bot runs unattended, so its tests run on every change to it.
# Everything here is offline: no test touches a live feed or a real inbox.

name: BFSI digest tests

on:
  push:
    paths:
      - "bfsi-insurance-digest-bot/**"
      - ".github/workflows/bfsi-digest-tests.yml"
  pull_request:
    paths:
      - "bfsi-insurance-digest-bot/**"
      - ".github/workflows/bfsi-digest-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bfsi-insurance-digest-bot

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bfsi-insurance-digest-bot/requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
