      - CSAT

# -------------------------------------------------------------------- search
# The phrases that go out to the boards that accept a query (Careerjet, Jooble,
# Adzuna) and into the saved-search links at the foot of every digest. Kept
# short: these APIs match loosely, and a long query returns nothing at all.
queries:
  - vice president key account management insurance
  - vice president bancassurance life insurance
  - head of partnership distribution insurance
  - vice president strategic alliances insurance
  - AVP key account manager life insurance
