# What counts as BFSI news, and which section a story belongs in.
#
# How an article is scored
#   1. Exclusions   any match in `exclude` drops the article outright.
#   2. Domain gate  the article must show it belongs to the BFSI world, in one
#                   of three ways: it matched something in `domain_gate`; it
#                   matched a strong keyword from a section marked
#                   `certifies_domain` (the default — "HDFC Life" and "IRDAI"
#                   say "insurance" without using the word); or it came from a
#                   source whose weight is >= gate_bypass_weight (a specialist
#                   BFSI desk — everything it prints is on-topic).
#                   Sections whose keywords name a kind of event rather than
#                   this industry ("IPO", "appoints", "repo rate") set
#                   `certifies_domain: false`, so a story filed under them has
#                   to prove the domain some other way. Without that, the word
#                   "IPO" alone would admit any company on earth.
#   3. Sections     every section scores the article on its own keywords:
#                     strong keyword     -> strong_weight
#                     supporting keyword -> supporting_weight
#                   a hit in the headline is worth title_multiplier times a hit
#                   in the summary, each distinct keyword counts once, and the
#                   section subtotal is scaled by that section's `multiplier`.
#   4. Routing      the best-scoring section wins; ties break by the order
#                   sections appear below. The source's section_hint adds
#                   hint_bonus to that section.
#   5. Admission    best section score + source weight >= digest.min_score.
#
# Matching is case-insensitive and on word boundaries, so "LIC" does not match
# "policy" and "AI" does not match "Mumbai". Multi-word entries match as phrases
# with flexible whitespace.

scoring:
  strong_weight: 3.0
  supporting_weight: 1.0
  title_multiplier: 1.5
  hint_bonus: 2.0
  gate_bypass_weight: 2.0
  # Cap how many distinct keywords can contribute, so a listicle that name-drops
  # thirty insurers cannot outrank a genuine regulatory circular.
  max_keywords_counted: 8

# Anything here disqualifies an article no matter what else it matched. These
# are the recurring off-topic items that ride along on general business feeds.
exclude:
  - horoscope
  - astrology
  - zodiac
  - cricket
  - IPL
  - box office
  - web series
  - movie review
  - recipe
  - admit card
  - sarkari result
  - board exam result
  - gold rate today
  - silver rate today
  - petrol price today
  - diesel price today
  - match preview
  - live score

  # Quote and ticker pages, not journalism. A search feed indexes them as
  # articles, and their headlines are dense with the company names the
  # taxonomy is looking for, so nothing else keeps them out. Deliberately
  # narrow: a real story about a share price moving ("HDFC Life shares jump
  # 5% after results") says nothing about a live NSE feed, so it survives.
  - live NSE
  - live BSE
  - stock quote
  - share price target

  # Sports sponsorship. `cricket` and `IPL` already sit above, but a title-
  # rights story names the board, not the sport — and an insurer's name in the
  # headline is enough to carry it into the brief otherwise.
  - BCCI
  - title rights

  # A Mysore road junction named after the insurer. Of a piece with the ticker
  # below: `LIC` is three letters that mean the Life Insurance Corporation in
  # almost every Indian headline and something else entirely in a handful, and
  # an exclude list can only ever patch those one at a time. See the note in
  # docs/tuning.md on why the general fix is a change to how search-feed
  # sources open the domain gate, not more entries here.
  - LIC Circle

  # A foreign exchange ticker prefix in the headline. This is an India brief,
  # and three-letter tickers collide badly with Indian acronyms — ASX:LIC is
  # an Australian property developer, and it reached a life-insurance brief
  # on the strength of the letters LIC alone. Scope decision, not a universal
  # truth: turning on the global source in sources.yaml means revisiting it.
  - ASX

# The article must touch the BFSI world somewhere. Broad on purpose — precision
# comes from the section scores, this is only a floor.
domain_gate:
  - insurance
  - insurer
  - reinsurance
  - policyholder
  - premium
  - annuity
  - actuarial
  - underwriting
  - bank
  - banking
  - NBFC
  - lender
  - lending
  - credit
  - deposit
  - mutual fund
  - pension
  - IRDAI
  - RBI
  - SEBI
  - PFRDA
  - IFSCA
  - fintech
  - insurtech
  - BFSI
  - financial services
  - capital markets
  - asset management
  - wealth management
  - payments
  # Terms that occur nowhere but financial services. They matter because the
  # sections that own them (markets_macro, technology) do not certify the
  # domain themselves — without these, a genuine UPI or repo-rate story would
  # have nothing to prove itself with. Anything ambiguous across industries
  # ("inflation", "AI", "IPO") deliberately stays out.
  - UPI
  - account aggregator
  - monetary policy
  - repo rate
  - bond yield
  - NPS
  - EPFO

