# News sources for the daily digest. Every source is a public RSS/Atom feed —
# no API keys, no scraping, no logins.
#
# Fields
#   id            stable slug, used in the seen-store and in per-source caps
#   name          shown as the attribution on each item
#   url           the feed
#   weight        relevance bonus added to every article from this source
#                 (0 = neutral, 2-3 = a specialist BFSI desk)
#   section_hint  nudges routing when the headline alone is ambiguous
#   enabled       set false to mute a source without deleting it
#
# Every URL below was verified against a live network on 22 Aug 2026 and was
# returning fresh items. Publishers do move feeds — re-check with:
#     python -m bot check-sources
# or, on GitHub, Actions → BFSI digest → Run workflow → mode `check-sources`.

sources:
  # ---------------------------------------------------------------- specialist
  # ET BFSI publishes exactly two working feeds. Its per-section URLs
  # (/rss/insurance, /rss/banking, /rss/policy, /rss/financial-services) return
  # a valid but permanently empty RSS shell, so they are not listed here —
  # between them these two carry the same desk's output anyway.
  - id: et-bfsi-top
    name: ET BFSI
    url: https://bfsi.economictimes.indiatimes.com/rss/topstories
    weight: 2.0
    enabled: true

  - id: et-bfsi-recent
    name: ET BFSI · Latest
    url: https://bfsi.economictimes.indiatimes.com/rss/recentstories
    weight: 2.0
    enabled: true

  # ------------------------------------------------------------------ regulators
  - id: rbi-press
    name: RBI Press Releases
    url: https://www.rbi.org.in/pressreleases_rss.xml
    weight: 3.0
    section_hint: regulation
    enabled: true

  # Genuinely low-volume: RBI can go several days without a notification, so
  # `check-sources` flagging this one as stale is normal, not a fault.
  - id: rbi-notifications
    name: RBI Notifications
    url: https://www.rbi.org.in/notifications_rss.xml
    weight: 3.0
    section_hint: regulation
    enabled: true

  # IRDAI publishes no feed of its own, so its circulars, orders and master
  # directions reach the digest through the targeted news queries below.

  # ------------------------------------------------------------ targeted queries
  # Google News search feeds — the backbone of this list. They carry the most
  # volume, and they are also how stories from publishers that block direct feed
  # access (Business Standard, Financial Express) still reach the brief, with
  # the originating outlet named in the item's <source> element.
  #
  # Every one of these sits *below* `gate_bypass_weight` (2.0) on purpose. The
  # bypass exists for curated desks, where an editor has already decided the
  # story is BFSI. These are search queries: a query for `LIC` returns road
  # junctions, so their results have to prove the domain on their own words.
  # Raising any of them to 2.0 or above reopens that hole.
  #
  # Retune by editing the q= parameter; keep hl/gl/ceid pointed at India.
  - id: gnews-irdai
    name: News · IRDAI
    url: https://news.google.com/rss/search?q=IRDAI+OR+%22insurance+regulator%22+when:2d&hl=en-IN&gl=IN&ceid=IN:en
    weight: 1.5
    section_hint: regulation
    enabled: true

  - id: gnews-life-insurance
    name: News · Life Insurance
    url: https://news.google.com/rss/search?q=%22life+insurance%22+India+when:2d&hl=en-IN&gl=IN&ceid=IN:en
    weight: 1.5
    section_hint: life_insurance
    enabled: true

  - id: gnews-life-insurers
    name: News · Life Insurers
    url: https://news.google.com/rss/search?q=(LIC+OR+%22HDFC+Life%22+OR+%22SBI+Life%22+OR+%22ICICI+Prudential+Life%22+OR+%22Max+Life%22+OR+%22Bajaj+Allianz+Life%22)+when:2d&hl=en-IN&gl=IN&ceid=IN:en
    weight: 1.0
    section_hint: corporate
    enabled: true

  - id: gnews-bfsi
    name: News · BFSI
    url: https://news.google.com/rss/search?q=BFSI+OR+%22banking+financial+services+and+insurance%22+when:2d&hl=en-IN&gl=IN&ceid=IN:en
    weight: 1.0
    enabled: true

  - id: gnews-insurtech
    name: News · InsurTech
    url: https://news.google.com/rss/search?q=insurtech+OR+%22insurance+technology%22+India+when:3d&hl=en-IN&gl=IN&ceid=IN:en
    weight: 1.0
    section_hint: technology
    enabled: true

  # --------------------------------------------------------- general business
  # Broad desks. Weighted at or near zero: a story from here has to earn its
  # place on keywords alone, which is what keeps cricket and cinema out of a
  # BFSI brief.
  - id: bl-money-banking
    name: BusinessLine · Money & Banking
    url: https://www.thehindubusinessline.com/money-and-banking/feeder/default.rss
    weight: 1.0
    section_hint: banking_nbfc
    enabled: true

  - id: mint-money
    name: Mint · Money
    url: https://www.livemint.com/rss/money
    weight: 0.0
    enabled: true

  # Deliberately absent, and why — so nobody re-adds them expecting them to work:
  #   business-standard.com  HTTP 403 to any non-browser client
  #   financialexpress.com   HTTP 403 to any non-browser client
  #   moneycontrol.com       feeds parse, but abandoned: latestnews.xml last
  #                          published Apr 2023, MCtopnews.xml Oct 2016
  # All three are still covered indirectly through the news queries above.

  # ------------------------------------------------------------------- global
  # Off by default — switch on for an international view alongside the India
  # brief. Expect the digest to roughly double in length.
  - id: gnews-global-insurance
    name: News · Global Insurance
    url: https://news.google.com/rss/search?q=%22life+insurance%22+OR+reinsurance+(regulation+OR+results)+when:2d&hl=en-US&gl=US&ceid=US:en
    weight: 0.0
    enabled: false
